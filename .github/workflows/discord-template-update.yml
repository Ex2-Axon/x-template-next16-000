name: Notify Discord on Template Update

on:
  push:
    branches:
      - main

jobs:
  notify_discord:
    runs-on: ubuntu-latest
    steps:
    # 1. สำคัญมาก! ต้องดึงไฟล์จาก Repo ลงเครื่องก่อน
    - uses: actions/checkout@v5

    # 2. สั่งยิงข้อความและส่งไฟล์ภาพเข้า Discord ทันที (ไม่ต้องเช็กเงื่อนไขแล้ว)
    - name: Send Discord Notification with Screenshot
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        if [ -z "$DISCORD_WEBHOOK_URL" ]; then
          echo "ERROR: DISCORD_WEBHOOK_URL is missing!"
          exit 1
        fi
        
        echo "🚀 Sending text and uploading screenshot to Discord..."
        
        # ปรับมาใช้ Single Quote ('...') ครอบข้อมูล payload_json ทั้งชุดไปเลย เพื่อล็อกฟอร์แมต JSON ให้เสถียร
        curl -s -X POST "${DISCORD_WEBHOOK_URL}?thread_id=1148281134267420783" \
          -F "file=@screenshot.png" \
          -F 'payload_json={"embeds": [{"title": "🎉 Template Update - New Deploy", "description": "Latest update of the template website. Preview attached below.", "color": 5793266, "fields": [{"name": "Repository", "value": "'"${{ github.repository }}"'", "inline": true}, {"name": "Branch", "value": "'"${{ github.ref_name }}"'", "inline": true}]}]}'
          
        echo "✅ Done!"
