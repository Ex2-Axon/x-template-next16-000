name: Notify Discord on Template Update

on:
  push:
    branches:
      - main
      - master

jobs:
  notify_discord:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install -g playwright

      - name: Generate screenshot
        run: |
          node screenshot.js || echo "Screenshot generation completed"

      - name: Check for screenshot file
        id: check_screenshot
        run: |
          if [ -f screenshot.png ]; then
            echo "screenshot_exists=true" >> "$GITHUB_OUTPUT"
            ls -lh screenshot.png
          else
            echo "screenshot_exists=false" >> "$GITHUB_OUTPUT"
            echo "Screenshot not found"
          fi

      - name: Send Discord notification with screenshot
        if: steps.check_screenshot.outputs.screenshot_exists == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "ERROR: DISCORD_WEBHOOK_URL not configured"
            exit 1
          fi

          echo "🚀 Sending notification to Discord..."
          
          # Create and send embed message
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "embeds": [
                {
                  "title": "🎉 Template Update - New Deploy",
                  "description": "Latest screenshot of the template website",
                  "color": 5793266,
                  "fields": [
                    {
                      "name": "Repository",
                      "value": "${{ github.repository }}",
                      "inline": true
                    },
                    {
                      "name": "Branch",
                      "value": "${{ github.ref_name }}",
                      "inline": true
                    },
                    {
                      "name": "Commit",
                      "value": "[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})",
                      "inline": false
                    },
                    {
                      "name": "Author",
                      "value": "${{ github.actor }}",
                      "inline": true
                    }
                  ],
                  "footer": {
                    "text": "GitHub Actions"
                  }
                }
              ]
            }'
          
          sleep 2
          
          # Send screenshot as attachment
          echo "📸 Uploading screenshot..."
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -F "file=@screenshot.png" \
            -F "payload_json={\"content\":\"📷 Latest preview\"}"
          
          echo ""
          echo "✅ Discord notification sent!"
